name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Godot Game

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile with Godot Action
        uses: godotengine/build-action@v2
        with:
          godot_version: 4.2.1
          archive_output: true
          
