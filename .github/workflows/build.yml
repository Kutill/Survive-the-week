name: Build Android APK

on: [push]

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/barichello/godot-ci:4.2.1-stable

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Directory
        run: mkdir -p build/android

      - name: Run Godot Export
        run: |
          godot --headless --export-debug "Android" build/android/zombie_game.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zombie-game-apk
          path: build/android/zombie_game.apk
          
